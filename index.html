<head>

<script>
/* 运行期错误收集（诊断用，不影响业务） */
window.__errs = [];
window.addEventListener('error', function (e) { try { window.__errs.push((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || 0)); } catch (x) {} });
window.addEventListener('unhandledrejection', function (e) { try { window.__errs.push('rejection: ' + String((e.reason && e.reason.message) || e.reason)); } catch (x) {} });
</script>
</head>
<body>
<div id="loginOverlay" class="show">
  <div class="lg-card">
    <img class="lg-logo" src="assets/logo.png" alt="GlobalVertical">
    <div class="lg-title">澳洲 FCL 客户管理系统</div>
    <div class="lg-sub">AUSTRALIA FCL · CUSTOMER MANAGEMENT</div>
    <div class="lg-field">
      <label for="lgUser">账 号</label>
      <input id="lgUser" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="请输入账号">
    </div>
    <div class="lg-field">
      <label for="lgPass">密 码</label>
      <input id="lgPass" class="input" type="password" autocomplete="off" placeholder="请输入密码">
    </div>
    <div class="lg-field">
      <label for="lgCaptcha">验证码</label>
      <div class="lg-cap-row">
        <input id="lgCaptcha" class="input" type="text" autocomplete="off" spellcheck="false" placeholder="请输入右侧验证码">
        <canvas id="lgCanvas" width="124" height="44" title="看不清？点一下换一张"></canvas>
      </div>
    </div>
    <label class="lg-remember"><input type="checkbox" id="lgRemember" checked> 记住登录状态（12 小时内免登录）</label>
    <button id="lgBtn" type="button">登 录</button>
    <div class="lg-msg" id="lgMsg"></div>
    <div class="lg-foot">仅授权人员使用 · 登录后所有操作记录在本机数据文件</div>
  </div>
</div>

<div id="app" class="locked">
  <aside class="sidebar">
    <div class="brand">
      <img id="brandLogo" src="assets/logo.png" alt="GlobalVertical">
      <div class="brand-txt">
        <div class="brand-name">澳洲 FCL</div>
        <div class="brand-sub" id="brandSub">客户管理系统</div>
      </div>
      <button class="nav-toggle" id="navToggle" title="折叠 / 展开侧栏">☰</button>
    </div>
    <nav class="nav">
      <div class="nav-group">业务</div>
      <button class="nav-item active" data-nav="dashboard"><span class="ni">🏠</span><span class="nt">工作台</span></button>
      <button class="nav-item" data-nav="flow"><span class="ni">🧭</span><span class="nt">引导式建档</span><span class="badge-new">5 步</span></button>
      <button class="nav-item" data-nav="customers"><span class="ni">👥</span><span class="nt">客户管理</span></button>
      <div class="nav-group">数据</div>
      <button class="nav-item" data-nav="backup"><span class="ni">🛡</span><span class="nt">备份中心</span></button>
      <button class="nav-item" data-nav="export"><span class="ni">📄</span><span class="nt">导出中心</span></button>
      <div class="nav-group">系统</div>
      <button class="nav-item" data-nav="settings"><span class="ni">⚙️</span><span class="nt">系统设置</span></button>
      <button class="nav-item" data-nav="help"><span class="ni">❓</span><span class="nt">使用指南</span></button>
    </nav>
    <div class="side-foot">
      <div class="sf-row"><span class="sf-k">数据</span><span class="sf-v" id="sfData">data/db.json</span></div>

  <main class="main">
    <header class="topbar">
      <div class="tb-left">
        <div class="search-box">
          <span class="sb-ico">🔍</span>
          <input id="globalSearch" placeholder="搜索客户：公司 / 联系人 / 电话 / 邮编…（按 / 聚焦，回车搜索）">
        </div>
      </div>
      <div class="tb-right">
        <span class="conn-chip" id="connChip"><i></i>连接中…</span>
        <span class="who">👤 <b id="whoUser">RAYMOND</b></span>
        <button class="btn ghost tiny" id="logoutBtn" title="退出登录">退出</button>
        <button class="btn ghost tiny" id="guideBtn">使用引导</button>
        <button class="btn ghost tiny" id="seedBtn">示例数据</button>

    <div class="main-scroll" id="mainScroll">

    <footer class="statusbar">

      <span class="sb-sep">|</span>
      <span>PDF：<b id="sbPdf">检测中…</b></span>
      <span class="spacer"></span>
      <span class="sb-hint" id="sbHint">检测中…</span>

<script src="js/app.mjs?v=20261016h"></script>
<script>
/* 顶栏状态同步（不侵入业务逻辑） */
(function () {
  function sync() {
    var st = App.state;
    var mode = document.getElementById('sbMode');
    var pdf = document.getElementById('sbPdf');
    var sfB = document.getElementById('sfBackup');
    var sfD = document.getElementById('sfData');
    var local = !!(st.offline || st.fileMode);
    if (mode) mode.textContent = local
      ? (st.fileMode ? '在线版 / 单机模式（数据存本机浏览器）' : '在线版（数据存本机浏览器，无后端）')
      : '全栈在线（Node 服务 + db.json）';
    if (sfB) sfB.textContent = (st.stats && st.stats.backups !== undefined) ? (st.stats.backups + ' 份快照') : '—';
    if (sfD) sfD.textContent = local ? '浏览器本地' : 'data/db.json';
    var hint = document.getElementById('sbHint');
    if (hint) hint.textContent = local
      ? '数据存浏览器本地 · 建议定期「导出整库 JSON」备份'
      : '数据实时落盘 data/db.json + 自动快照 data/backups';
    if (pdf) {
      fetch('api/health').then(function (r) { return r.json(); }).then(function (h) {
        pdf.textContent = h.pdfReady ? 'Edge 无头渲染可用' : '浏览器打印模式';
      }).catch(function () { pdf.textContent = '浏览器打印模式'; });
    }
  }
  document.addEventListener('DOMContentLoaded', function () { setTimeout(sync, 900); });
  document.addEventListener('app:ready', function () { setTimeout(sync, 60); });
  window.addEventListener('hashchange', function () { setTimeout(sync, 700); });
  setInterval(sync, 20000);
})();
</script>
<script>
/* PWA：仅在 https（真网站）下注册 Service Worker，本地 file:// 不注册 */
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
